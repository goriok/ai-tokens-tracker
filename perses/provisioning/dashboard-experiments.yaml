kind: Dashboard
metadata:
  name: experiments
  project: ai-tokens-tracker
spec:
  display:
    name: AI Tokens — Experiments
    description: >-
      Comparação A/B de consumo de token entre sessões nomeadas — para os
      experimentos rag-vs-manual (ver .claude/workflows/). Escolha as sessões
      de cada grupo nos seletores (busca por nome, múltipla seleção). Ver
      docs/madrs/MADR-003.
  duration: 90d
  refreshInterval: 0s
  variables:
    - kind: ListVariable
      spec:
        name: groupA
        display:
          name: Grupo A (ex. rag / com skill)
        allowAllValue: true
        allowMultiple: true
        defaultValue: []
        sort: alphabetical-desc
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: session_name
    - kind: ListVariable
      spec:
        name: groupB
        display:
          name: Grupo B (ex. manual / sem skill)
        allowAllValue: true
        allowMultiple: true
        defaultValue: []
        sort: alphabetical-desc
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            labelName: session_name
  panels:
    totalsByGroup:
      kind: Panel
      spec:
        display:
          name: Total de tokens por sessão selecionada
          description: Uma barra por sessão — compare visualmente os grupos A e B pelo nome.
        plugin:
          kind: BarChart
          spec:
            calculation: last
            sort: desc
            orientation: horizontal
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(last_over_time(aitokens_tokens_total{session_name=~"${groupA}|${groupB}"}[$__range])) by (session_name)
                  seriesNameFormat: '{{session_name}}'
    tokensByTypeGroupA:
      kind: Panel
      spec:
        display:
          name: 'Grupo A — tokens por tipo'
        plugin:
          kind: PieChart
          spec:
            calculation: last
            radius: 60
            legend:
              position: right
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(last_over_time(aitokens_tokens_total{session_name=~"$groupA"}[$__range])) by (token_type)
                  seriesNameFormat: '{{token_type}}'
    tokensByTypeGroupB:
      kind: Panel
      spec:
        display:
          name: 'Grupo B — tokens por tipo'
        plugin:
          kind: PieChart
          spec:
            calculation: last
            radius: 60
            legend:
              position: right
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(last_over_time(aitokens_tokens_total{session_name=~"$groupB"}[$__range])) by (token_type)
                  seriesNameFormat: '{{token_type}}'
    totalGroupA:
      kind: Panel
      spec:
        display:
          name: Grupo A — total
        plugin:
          kind: StatChart
          spec:
            calculation: last
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(last_over_time(aitokens_tokens_total{session_name=~"$groupA"}[$__range]))
    totalGroupB:
      kind: Panel
      spec:
        display:
          name: Grupo B — total
        plugin:
          kind: StatChart
          spec:
            calculation: last
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(last_over_time(aitokens_tokens_total{session_name=~"$groupB"}[$__range]))
    modelBreakdownGroupA:
      kind: Panel
      spec:
        display:
          name: 'Grupo A — modelo usado'
        plugin:
          kind: PieChart
          spec:
            calculation: last
            radius: 60
            legend:
              position: right
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(last_over_time(aitokens_tokens_total{session_name=~"$groupA"}[$__range])) by (model)
                  seriesNameFormat: '{{model}}'
    modelBreakdownGroupB:
      kind: Panel
      spec:
        display:
          name: 'Grupo B — modelo usado'
        plugin:
          kind: PieChart
          spec:
            calculation: last
            radius: 60
            legend:
              position: right
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(last_over_time(aitokens_tokens_total{session_name=~"$groupB"}[$__range])) by (model)
                  seriesNameFormat: '{{model}}'
  layouts:
    - kind: Grid
      spec:
        display:
          title: Totais comparados
          collapse:
            open: true
        items:
          - x: 0
            y: 0
            width: 12
            height: 4
            content:
              $ref: "#/spec/panels/totalGroupA"
          - x: 12
            y: 0
            width: 12
            height: 4
            content:
              $ref: "#/spec/panels/totalGroupB"
          - x: 0
            y: 4
            width: 24
            height: 8
            content:
              $ref: "#/spec/panels/totalsByGroup"
    - kind: Grid
      spec:
        display:
          title: Breakdown por tipo de token
          collapse:
            open: true
        items:
          - x: 0
            y: 0
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/tokensByTypeGroupA"
          - x: 12
            y: 0
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/tokensByTypeGroupB"
    - kind: Grid
      spec:
        display:
          title: Modelo usado
          collapse:
            open: true
        items:
          - x: 0
            y: 0
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/modelBreakdownGroupA"
          - x: 12
            y: 0
            width: 12
            height: 8
            content:
              $ref: "#/spec/panels/modelBreakdownGroupB"
